name: navigator_app
description: Навигатор на Flutter с Яндекс MapKit - GPS, маршрут на авто, общественный транспорт, пробки.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Полная версия MapKit: карта, пробки, GPS + маршруты на авто и общественный транспорт.
  # (yandex_maps_mapkit_lite маршруты НЕ умеет)
  yandex_maps_mapkit: ^4.45.0

  # Запрос разрешения на геолокацию
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
